[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sniff"
version = "0.1.0"
description = "A smart journal matcher for CAPES/Sucupira and international publishers"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Seu Nome Completo", email = "seu.email@provedor.com" }
]
keywords = ["capes", "sucupira", "qualis", "academic", "journal", "matcher"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.30.0",
]